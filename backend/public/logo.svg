<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- Fond icône arrondi -->
  <rect x="4" y="8" width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Croissant (lune) -->
  <path d="M36 20 A18 18 0 1 0 36 60 A12 12 0 1 1 36 20Z" fill="white" opacity="0.92"/>

  <!-- Croix médicale -->
  <rect x="44" y="30" width="18" height="6" rx="3" fill="#10B981"/>
  <rect x="50" y="24" width="6" height="18" rx="3" fill="#10B981"/>

  <!-- Nom principal -->
  <text x="82" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1E293B" letter-spacing="-0.5">Dar</text>
  <text x="118" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#0D9488" letter-spacing="-0.5">-Soins</text>

  <!-- Sous-titre -->
  <text x="82" y="56" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B" letter-spacing="2.5">SOINS INFIRMIERS À DOMICILE</text>

  <!-- Ligne décorative -->
  <line x1="82" y1="61" x2="290" y2="61" stroke="#0D9488" stroke-width="1.5" opacity="0.4"/>

  <!-- Maroc en arabe stylisé -->
  <text x="82" y="74" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#94A3B8" letter-spacing="1">المغرب · MAROC</text>
</svg>
