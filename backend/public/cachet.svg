<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .stamp-text { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #1E3A8A; }
    </style>
  </defs>

  <!-- Cercle extérieur double trait -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#1E3A8A" stroke-width="3.5" opacity="0.85"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#1E3A8A" stroke-width="1.2" opacity="0.6"/>

  <!-- Texte courbe haut : DAR-SOINS MAROC -->
  <path id="topArc" d="M 18,100 A 82,82 0 0,1 182,100" fill="none"/>
  <text class="stamp-text" font-size="13.5" letter-spacing="3.5">
    <textPath href="#topArc" startOffset="8%">DAR-SOINS MAROC · SOINS À DOMICILE</textPath>
  </text>

  <!-- Texte courbe bas : ICE + ville -->
  <path id="bottomArc" d="M 22,108 A 82,82 0 0,0 178,108" fill="none"/>
  <text class="stamp-text" font-size="10.5" letter-spacing="2" opacity="0.8">
    <textPath href="#bottomArc" startOffset="10%">ICE : 002847561000083 · CASABLANCA</textPath>
  </text>

  <!-- Séparateurs décoratifs -->
  <line x1="100" y1="18" x2="100" y2="28" stroke="#1E3A8A" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="172" x2="100" y2="182" stroke="#1E3A8A" stroke-width="2" opacity="0.7"/>

  <!-- Croix médicale centrale -->
  <rect x="88" y="78" width="24" height="8" rx="4" fill="#0D9488"/>
  <rect x="96" y="70" width="8" height="24" rx="4" fill="#0D9488"/>

  <!-- Croissant décoratif sous la croix -->
  <path d="M100 102 A10 10 0 1 0 100 122 A7 7 0 1 1 100 102Z" fill="#1E3A8A" opacity="0.7"/>

  <!-- Nom en centre bas -->
  <text x="100" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1E3A8A" letter-spacing="1">Dar-Soins</text>
  <text x="100" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0D9488" letter-spacing="2.5">APPROUVÉ</text>

  <!-- Étoile à 6 branches (étoile de David marocaine) -->
  <g transform="translate(100,68)" opacity="0.15">
    <polygon points="0,-8 2.3,-3.2 7.6,-2.5 3.8,1.2 4.7,6.5 0,4 -4.7,6.5 -3.8,1.2 -7.6,-2.5 -2.3,-3.2" fill="#1E3A8A"/>
  </g>

  <!-- Effet vieilli / texture légère -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#1E3A8A" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.3"/>
</svg>
